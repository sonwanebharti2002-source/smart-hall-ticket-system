<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Smart Hall Ticket | People Education Society</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#172033
}

.wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px
}

.card{
    width:100%;
    max-width:430px;
    background:#fff;
    border-radius:22px;
    padding:28px;
    box-shadow:0 15px 45px #17203320
}

.logo{
    width:64px;
    height:64px;
    border-radius:18px;
    background:#173b8f;
    color:#fff;
    display:grid;
    place-items:center;
    font-size:28px;
    font-weight:700;
    margin:auto
}

h1{
    text-align:center;
    font-size:23px;
    margin:16px 0 5px
}

.sub{
    text-align:center;
    color:#667085;
    font-size:14px;
    margin-bottom:25px
}

label{
    display:block;
    font-weight:600;
    font-size:14px;
    margin:14px 0 7px
}

input{
    width:100%;
    padding:13px 14px;
    border:1px solid #d7dce5;
    border-radius:11px;
    font-size:15px;
    outline:none
}

button{
    width:100%;
    border:0;
    border-radius:11px;
    padding:14px;
    background:#173b8f;
    color:#fff;
    font-size:16px;
    font-weight:700;
    margin-top:20px
}

.demo{
    margin-top:18px;
    padding:12px;
    border-radius:10px;
    background:#f5f7fa;
    color:#667085;
    font-size:12px;
    text-align:center
}

.msg{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    font-size:14px
}

.bad{
    background:#fff0f0;
    color:#b42318
}

.dashboard{
    display:none
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center
}

.pill{
    padding:7px 10px;
    border-radius:20px;
    background:#eaf8ef;
    color:#18733b;
    font-size:12px;
    font-weight:700
}

.info{
    margin-top:20px;
    border:1px solid #e6eaf0;
    border-radius:15px;
    overflow:hidden
}

.row{
    display:flex;
    justify-content:space-between;
    padding:12px 14px;
    border-bottom:1px solid #eef1f5;
    font-size:14px
}

.row:last-child{
    border-bottom:0
}

.key{
    color:#667085
}

.value{
    font-weight:700
}

.elig{
    margin-top:16px;
    padding:14px;
    border-radius:12px;
    font-weight:700
}

.qrbox{
    margin-top:20px;
    text-align:center;
    padding:18px;
    border:1px solid #e6eaf0;
    border-radius:15px
}

#qrcode{
    display:flex;
    justify-content:center;
    margin-top:12px
}

.logout{
    background:#fff;
    color:#173b8f;
    border:1px solid #173b8f;
    margin-top:12px
}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<section id="login">

<div class="logo">PE</div>

<h1>Smart Hall Ticket</h1>

<div class="sub">
People Education Society · Mid-Sem Examination
</div>

<label>PRN</label>

<input
id="prn"
inputmode="numeric"
placeholder="Enter your PRN">

<label>Password</label>

<input
id="password"
type="password"
placeholder="Enter password">

<button onclick="login()">
Student Login
</button>

<div id="msg" class="msg"></div>

<div class="demo">
CSE (Data Science) · 3rd Year / Sem 5
</div>

</section>


<section id="dashboard" class="dashboard">

<div class="top">

<div>

<h2 style="margin:0">
Digital Hall Ticket
</h2>

<div style="color:#667085;font-size:13px">
Mid-Sem Examination
</div>

</div>

<span id="status" class="pill">
VERIFIED
</span>

</div>


<div class="info">

<div class="row">
<span class="key">Name</span>
<span class="value" id="name"></span>
</div>

<div class="row">
<span class="key">PRN</span>
<span class="value" id="dprn"></span>
</div>

<div class="row">
<span class="key">Branch</span>
<span class="value" id="branch"></span>
</div>

<div class="row">
<span class="key">Year / Semester</span>
<span class="value" id="year"></span>
</div>

<div class="row">
<span class="key">Fees</span>
<span class="value" id="fees"></span>
</div>

<div class="row">
<span class="key">Attendance</span>
<span class="value" id="attendance"></span>
</div>

<div class="row">
<span class="key">Roll No.</span>
<span class="value" id="roll"></span>
</div>

<div class="row">
<span class="key">Allotted Bench</span>
<span class="value" id="bench"></span>
</div>

</div>


<div id="eligibility" class="elig"></div>


<div class="qrbox">

<h3 style="margin:0">
QR Verification
</h3>

<div id="qrcode"></div>

<p style="color:#667085;font-size:13px">
Scan this QR to verify hall ticket
</p>

</div>


<button class="logout" onclick="logout()">
Logout
</button>

</section>

</div>
</div>


<script>

const demoStudents = {

"24021341912022":{
name:"Ajay Gaikwad",
password:"Pass@123",
branch:"CSE (Data Science)",
year_sem:"3rd / 5th",
fees_status:"Paid",
attendance:85,
bench_no:"B24",
roll_no:24
},

"24021341912020":{
name:"Atharv Dhole",
password:"Pass@123",
branch:"CSE (Data Science)",
year_sem:"3rd / 5th",
fees_status:"Paid",
attendance:65,
bench_no:"B22",
roll_no:22
},

"24021341912013":{
name:"Gayatri Shende",
password:"Pass@123",
branch:"CSE (Data Science)",
year_sem:"3rd / 5th",
fees_status:"Paid",
attendance:80,
bench_no:"B15",
roll_no:15
},

"24021341912019":{
name:"Pratik Dakle",
password:"Pass@123",
branch:"CSE (Data Science)",
year_sem:"3rd / 5th",
fees_status:"Unpaid",
attendance:60,
bench_no:"B20",
roll_no:20
}

};


function login(){

const p =
document.getElementById("prn").value.trim();

const pw =
document.getElementById("password").value;

const s =
demoStudents[p];

const m =
document.getElementById("msg");


if(!s || s.password !== pw){

m.style.display="block";

m.className="msg bad";

m.textContent=
"Invalid PRN or password.";

return;

}


m.style.display="none";

showStudent(s,p);

}


function showStudent(s,p){

document.getElementById("login").style.display="none";

document.getElementById("dashboard").style.display="block";


document.getElementById("name").textContent=
s.name;

document.getElementById("dprn").textContent=
p;

document.getElementById("branch").textContent=
s.branch;

document.getElementById("year").textContent=
s.year_sem;

document.getElementById("fees").textContent=
s.fees_status;

document.getElementById("attendance").textContent=
s.attendance+"%";

document.getElementById("roll").textContent=
s.roll_no;

document.getElementById("bench").textContent=
s.bench_no;


const ok =
s.fees_status==="Paid" &&
s.attendance>=75;


const e =
document.getElementById("eligibility");


e.textContent =
ok
?
"ELIGIBLE — Fee Paid & Attendance ≥ 75%"
:
"NOT ELIGIBLE — Entry Blocked";


e.style.background =
ok ? "#eaf8ef" : "#fff0f0";

e.style.color =
ok ? "#18733b" : "#b42318";


document.getElementById("status").textContent =
ok ? "ELIGIBLE" : "BLOCKED";


/* IMPORTANT:
   QR now uses the logged-in student's PRN.
*/

const qr =
document.getElementById("qrcode");

qr.innerHTML="";


new QRCode(qr,{

text:"VERIFY-"+p,

width:180,

height:180

});

}


function logout(){

document.getElementById("dashboard").style.display="none";

document.getElementById("login").style.display="block";

document.getElementById("password").value="";

document.getElementById("qrcode").innerHTML="";

}

</script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</body>
</html>
