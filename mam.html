<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>People Education Society - QR Verification</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f2f5fa;
}

.card{
    max-width:500px;
    margin:auto;
    background:white;
    padding:22px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}

#reader{
    width:100%;
}

.result{
    margin-top:20px;
    padding:18px;
    border-radius:14px;
}

.success{
    background:#eaf8ef;
    color:#126b35;
}

.fail{
    background:#fff0f0;
    color:#a51d1d;
}

.info{
    background:#f5f7fa;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid #ddd;
}

.label{
    color:#666;
}

.value{
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

<h1>QR Verification</h1>

<div class="subtitle">
People Education Society<br>
Mid-Sem Examination
</div>

<div id="reader"></div>

<div id="result" class="result info">
Scan Student QR Code
</div>

</div>

<script>

const SUPABASE_URL =
"https://xxkqbwkstmwbqkhmiwwk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_y5oAZE8Hda93X-EedG5FTw_MNoV97pD";


async function verifyStudent(prn){

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/rpc/verify_student",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json",
                "apikey":SUPABASE_KEY,
                "Authorization":"Bearer " + SUPABASE_KEY
            },

            body:JSON.stringify({
                verification_id:"VERIFY-" + prn
            })
        }
    );

    const data = await response.json();

    if(!response.ok){
        throw new Error(
            data.message ||
            data.error ||
            JSON.stringify(data)
        );
    }

    return data;
}


async function onScanSuccess(decodedText){

    const result =
        document.getElementById("result");

    result.className="result info";

    result.innerHTML =
        "⏳ Verifying student...";

    try{

        if(!decodedText.startsWith("VERIFY-")){

            throw new Error(
                "Invalid Hall Ticket QR"
            );
        }

        const prn =
            decodedText.replace("VERIFY-","").trim();

        const data =
            await verifyStudent(prn);

        if(!data || data.length === 0){

            throw new Error(
                "Student record not found"
            );
        }

        const s=data[0];

        result.innerHTML=`

        <h2>Student Verified ✅</h2>

        <div class="row">
        <span class="label">Name</span>
        <span class="value">${s.name}</span>
        </div>

        <div class="row">
        <span class="label">PRN</span>
        <span class="value">${s.prn}</span>
        </div>

        <div class="row">
        <span class="label">Branch</span>
        <span class="value">${s.branch}</span>
        </div>

        <div class="row">
        <span class="label">Year / Semester</span>
        <span class="value">${s.year_sem}</span>
        </div>

        <div class="row">
        <span class="label">Fees</span>
        <span class="value">${s.fees_status}</span>
        </div>

        <div class="row">
        <span class="label">Attendance</span>
        <span class="value">${s.attendance}%</span>
        </div>

        <div class="row">
        <span class="label">Roll No.</span>
        <span class="value">${s.roll_no}</span>
        </div>

        <div class="row">
        <span class="label">Bench</span>
        <span class="value">${s.bench_no}</span>
        </div>

        ${
            s.eligible

            ?

            `<div class="result success">
            ✅ ELIGIBLE<br>
            Entry Allowed
            </div>`

            :

            `<div class="result fail">
            ❌ NOT ELIGIBLE<br>
            Entry Blocked
            </div>`
        }

        `;

    }

    catch(error){

        result.className="result fail";

        result.innerHTML=
            "❌ Verification Failed<br><br>" +
            error.message;
    }

}


const scanner =
new Html5QrcodeScanner(
    "reader",
    {
        fps:10,
        qrbox:{
            width:250,
            height:250
        }
    }
);

scanner.render(onScanSuccess);

</script>

</body>
</html>
