<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invigilator QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:Arial;
  background:#f3f6fb;
  margin:0;
  padding:20px;
}
.card{
  max-width:450px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 30px #0002;
}
h1{text-align:center}
#reader{
  margin-top:20px;
}
.result{
  margin-top:20px;
  padding:15px;
  border-radius:12px;
  background:#f5f7fa;
}
button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#173b8f;
  color:white;
  font-size:16px;
}
</style>
</head>

<body>

<div class="card">

<h1>Invigilator Scanner</h1>

<p style="text-align:center;">
People Education Society<br>
Mid-Sem Examination
</p>

<div id="reader"></div>

<div id="result" class="result">
QR scan केल्यावर student information येथे दिसेल.
</div>

</div>

<script>

function onScanSuccess(decodedText){

document.getElementById("result").innerHTML =
"<h3>QR Detected ✅</h3>" +
"<p>Verification ID:</p>" +
"<b>"+decodedText+"</b>" +
"<p style='color:#b42318'>Database verification पुढच्या step मध्ये जोडू.</p>";

}

const scanner = new Html5QrcodeScanner(
"reader",
{
fps:10,
qrbox:{width:250,height:250}
}
);

scanner.render(onScanSuccess);

</script>

</body>
</html>
